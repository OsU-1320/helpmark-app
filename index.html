<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#E5001A" />
    <meta
      name="description"
      content="ヘルプマーク所持者がNFCタップで支援を要請し、対応可能なサポーターにだけ通知が届くPWA"
    />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <title>ヘルプマークNET</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      // 新しいService Workerがアクティブになったら一度だけリロードして
      // 旧キャッシュのアプリシェルを確実に更新する（PWA更新残り対策）
      if ('serviceWorker' in navigator) {
        var __swRefreshing = false
        navigator.serviceWorker.addEventListener('controllerchange', function () {
          if (__swRefreshing) return
          __swRefreshing = true
          location.reload()
        })
      }
    </script>
  </body>
</html>
